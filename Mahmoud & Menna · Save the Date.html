<script>
(function(){
  var $=function(i){return document.getElementById(i)};
  var v=$("v"),sc=[$("s1"),$("s2"),$("s3"),$("s4")],rep=$("rep"),go=$("go"),snd=$("snd");
  /* split letters for per-letter reveal */
  document.querySelectorAll("[data-sp]").forEach(function(el){
    var tx=el.textContent;el.textContent="";
    for(var i=0;i<tx.length;i++){var s=document.createElement("span");s.className="ch";s.style.setProperty("--i",i);s.textContent=tx[i];el.appendChild(s)}
    el.setAttribute("aria-label",tx);
  });
  /* ON = scene start (video seconds), WR = seconds until all its text is written, HOLD = pause after writing */
  var ON=[3.9,8.0,14.0,20.0],WR=[2.4,5.2,6.4,0],HOLD=2,i=0,shown=-1,t0=0,held=false;
  function hide(){sc.forEach(function(e){e.classList.remove("on")})}
  function tick(){
    var t=v.currentTime,now=performance.now();
    if(shown<0){
      if(i<4&&t>=ON[i]){shown=i;t0=now;hide();sc[i].classList.add("on");rep.classList.toggle("on",i===3)}
    }else if(shown<3){
      if(now-t0>=(WR[shown]+HOLD)*1000){sc[shown].classList.remove("on");i=shown+1;shown=-1;if(held){held=false;v.play()}}
      else if(t>=ON[shown+1]-1.3&&!v.paused){held=true;v.pause()}
    }
    requestAnimationFrame(tick);
  }
  function start(){var p=v.play();if(p&&p.catch)p.catch(function(){go.style.display="flex"})}
  go.addEventListener("click",function(){go.style.display="none";v.play()});
  rep.addEventListener("click",function(){i=0;shown=-1;held=false;hide();rep.classList.remove("on");v.currentTime=0;v.play()});
  snd.addEventListener("click",function(){v.muted=!v.muted;snd.textContent=v.muted?"SOUND OFF":"SOUND ON";snd.setAttribute("aria-pressed",String(!v.muted))});
  requestAnimationFrame(tick);start();
})();
</script>
